name: Android build
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Smoke test
        run: npx playwright install --with-deps chromium && npm test
      - run: npx cap sync android
      - name: Debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: orbit-dodger-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Decode keystore
        id: ks
        env: { B64: '${{ secrets.ORBIT_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$B64" ]; then echo "$B64" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build release AAB
        if: steps.ks.outputs.present == 'true'
        env:
          ORBIT_KEYSTORE: ${{ runner.temp }}/upload.jks
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        if: steps.ks.outputs.present == 'true'
        with: { name: orbit-dodger-release-aab, path: android/app/build/outputs/bundle/release/app-release.aab }
